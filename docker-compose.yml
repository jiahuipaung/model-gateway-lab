services:
  gateway:
    build: .
    environment:
      DATABASE_URL: postgres://gateway:gateway@postgres:5432/model_gateway?sslmode=disable
      HTTP_ADDR: :8080
      WORKER_INTERVAL: 100ms
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 1s
      timeout: 3s
      retries: 30

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: model_gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d model_gateway"]
      interval: 1s
      timeout: 3s
      retries: 30

