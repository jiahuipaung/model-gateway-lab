services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: model_gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d model_gateway"]
      interval: 1s
      timeout: 3s
      retries: 30

