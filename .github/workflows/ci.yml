name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: model_gateway_test
          POSTGRES_USER: gateway_test
          POSTGRES_PASSWORD: gateway_test
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U gateway_test -d model_gateway_test"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://gateway_test:gateway_test@127.0.0.1:55433/model_gateway_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
      - run: go test -tags=integration ./internal/postgres -count=1
